version: 2
project_name: async

before:
  hooks:
    - go mod tidy

builds:
  - skip: true

source:
  enabled: true
  format: tar.gz
  name_template: "{{ .ProjectName }}-{{ .Version }}"
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: dingdayu
    name: async
  prerelease: auto
  mode: replace
  header: |
    ## async {{ .Version }}

    Safe asynchronous task management for Go applications.
  footer: |
    ---
    Refer to [CHANGELOG.md](https://github.com/dingdayu/async/blob/v5/CHANGELOG.md) for detailed upgrade notes.
